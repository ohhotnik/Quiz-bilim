<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Айтыс</title>
<style>
  body { font-family: Arial; background: #f2f2f2; margin: 0; padding: 20px; text-align: center; }
  .box { background: white; max-width: 400px; margin: 50px auto; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
  button { width: 95%; padding: 12px; background: #6a11cb; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
  button:hover { background: #4a0ea0; }
  .hidden { display: none; }
</style>
</head>
<body>

<!-- КІРУ БЕТІ -->
<div id="kiruBet" class="box">
  <h2>Кіру</h2>
  <p>Фамилия мен аты</p>
  <input id="atyInput" type="text" placeholder="Фамилия мен аты">
  <button onclick="kiru()">Кіру</button>
</div>

<!-- АЙТЫС БЕТІ -->
<div id="aytysBet" class="box hidden">
  <h2>Айтыс беті 🔥</h2>
  <p>Қош келдің, <b id="atyShygaru"></b>!</p>
  <p>Сен айтыс бетіндесің!</p>
  <hr>
  <p><b>Сұрақ:</b> Айтыс деген не?</p>
  <button onclick="alert('Дұрыс!')">Жауап беру</button>
  <br><br>
  <button onclick="shygu()" style="background:#999">Шығу</button>
</div>

<script>
  // Бет ашылғанда тексеру - кірген бе?
  let saktalganAty = localStorage.getItem("aty");
  if (saktalganAty) {
    korsetAitys(saktalganAty);
  }

  function kiru() {
    let aty = document.getElementById("atyInput").value.trim();
    if (aty == "") {
      alert("Фамилия мен атыңды жаз!");
      return;
    }
    localStorage.setItem("aty", aty);
    korsetAitys(aty);
  }

  function korsetAitys(aty) {
    document.getElementById("kiruBet").classList.add("hidden");
    document.getElementById("aytysBet").classList.remove("hidden");
    document.getElementById("atyShygaru").innerText = aty;
  }

  function shygu() {
    localStorage.removeItem("aty");
    location.reload();
  }
</script>

</body>
</html>
